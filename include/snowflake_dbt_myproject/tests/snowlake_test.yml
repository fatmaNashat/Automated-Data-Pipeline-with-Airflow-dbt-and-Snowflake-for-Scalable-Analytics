version: 2

models:
  - name: stg_orders
    columns:
      - name: order_status
        tests:
        - accepted_values:
            arguments:
              values: ['Completed', 'Pending', 'Cancelled']


  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null


          
